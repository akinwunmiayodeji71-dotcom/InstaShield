name: Build InstaShield APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          if [ -f "InstaShield.zip" ]; then
            unzip -o InstaShield.zip -d extracted
            if [ -d "extracted/InstaShield" ]; then
              cp -r extracted/InstaShield/* ./
            else
              cp -r extracted/* ./ || true
            fi
            rm -rf extracted InstaShield.zip
          fi
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then npm install; fi
      - name: Build APK
        run: |
          if [ -f "android/gradlew" ]; then
            cd android && chmod +x gradlew && ./gradlew assembleDebug && cd ..
          elif [ -f "package.json" ]; then
            npx expo prebuild --platform android --clean || true
            if [ -f "android/gradlew" ]; then
              cd android && chmod +x gradlew && ./gradlew assembleDebug && cd ..
            fi
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaShield-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            **/*.apk
